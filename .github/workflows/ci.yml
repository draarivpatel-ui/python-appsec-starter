name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  test:
    permissions:
      contents: read
    name: Python ${{ matrix.python-version }} on ubuntu-24.04
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile all Python files
        run: PYTHONPATH=src python3 -m compileall -q src tests examples scripts
      - name: Run adversarial and end-to-end tests
        run: PYTHONPATH=src python3 -m unittest discover -s tests -v
      - name: Run CLI smoke test
        run: PYTHONPATH=src python3 -m appsec_starter --help
      - name: Run example import checks
        run: |
          PYTHONPATH=src python3 -c "import appsec_starter; import examples.run_wsgi; import examples.run_http_server"
      - name: Install build tooling
        run: python3 -m pip install build
      - name: Build source and wheel distributions
        run: python3 -m build
      - name: Verify distribution contents
        run: python3 scripts/check_dist.py dist
