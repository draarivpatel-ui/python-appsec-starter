[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "python-appsec-starter"
version = "1.0.0"
description = "Zero-dependency Python AppSec starter, security middleware kit, and GitHub template"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "draarivpatel-ui contributors" }]
keywords = [
    "appsec",
    "application-security",
    "asgi",
    "devsecops",
    "fastapi",
    "flask",
    "owasp",
    "security",
    "starter-template",
    "wsgi",
    "zero-dependencies",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/draarivpatel-ui/python-appsec-starter"
Repository = "https://github.com/draarivpatel-ui/python-appsec-starter"
Issues = "https://github.com/draarivpatel-ui/python-appsec-starter/issues"
Documentation = "https://github.com/draarivpatel-ui/python-appsec-starter#readme"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["appsec_starter*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
appsec_starter = ["py.typed", "static/**/*"]
